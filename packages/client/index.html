<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mechas — sandbox</title>
    <style>
      :root { --gold: #c9a24a; --amber: #ffb347; --enamel: #e2ddd1; --ink: #070910; --line: #8a6a2a; --blue: #4d8dff; --green: #7dffb0; --cyan: #5fd0ff; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14170f; font: 12px/1.45 'Avenir Next Condensed', 'Arial Narrow', ui-sans-serif, sans-serif; color: var(--enamel); }
      body > canvas { position: fixed; inset: 0; }
      .box { background: rgba(9, 11, 18, .92); border: 1px solid var(--line); border-radius: 3px; user-select: none; }
      /* Marco blindado común a todos los módulos (9-slice renderizado en Blender). */
      .frame { border: 22px solid transparent; border-image: url(ui/frame.png) 64 / 22px stretch; background: linear-gradient(180deg, rgba(14, 17, 27, .97), rgba(6, 8, 13, .97)); background-clip: padding-box; user-select: none; box-sizing: border-box; }
      .frame.thin { border-width: 12px; border-image-width: 12px; }
      button { font: inherit; background: #141824; color: var(--amber); border: 1px solid #3a3420; border-radius: 2px; padding: 4px 10px; cursor: inherit; }
      button:hover:not(:disabled) { background: #1d2333; border-color: var(--gold); }
      button:disabled { opacity: .4; cursor: inherit; }
      kbd { font: 700 10px/1 ui-monospace, Menlo, monospace; color: #0b0d14; background: var(--amber); border-radius: 2px; padding: 2px 3px; }

      /* ---- barra superior */
      #top { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; gap: 18px; align-items: center; padding: 0 6px; font-size: 15px; color: var(--amber); white-space: nowrap; letter-spacing: .5px; }
      #top > * { flex-shrink: 0; }
      #top .res { display: flex; align-items: center; gap: 6px; }
      #top .res img { width: 26px; height: 26px; }
      #top .res b { color: var(--enamel); font-size: 16px; }
      .genBox { display: flex; align-items: center; gap: 6px; }
      .genBox img { width: 30px; height: 30px; }
      .genTag { color: var(--cyan); letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
      .modeTag { color: #8f8470; font-size: 12px; }
      .pill { display: flex; align-items: center; gap: 4px; padding: 2px 8px; height: 30px; }
      .pill img { width: 24px; height: 24px; }
      #idle.has { border-color: var(--amber); box-shadow: 0 0 8px rgba(255, 179, 71, .5); }
      #idle.has b { color: var(--amber); }
      #top .grow { flex-grow: 1; }
      #top .dim { color: #8f8470; font: 11px ui-monospace, Menlo, monospace; display: none; }
      #top.debug .dim { display: inline; }
      .speed { display: flex; gap: 2px; }
      .speed button { padding: 2px 8px; }
      .speed button.on { background: var(--amber); color: #0b0d14; }
      #sysMenu { position: absolute; top: 46px; right: 0; display: none; flex-direction: column; gap: 6px; width: 220px; }
      #sysMenu.open { display: flex; }
      #sysMenu button { text-align: left; }

      /* ---- barra inferior: tres módulos de la misma altura y el mismo marco */
      #hud { position: fixed; left: 0; right: 0; bottom: 0; height: 210px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px; pointer-events: none; }
      #hud > .frame { pointer-events: auto; }
      #actions { display: grid; grid-template-columns: repeat(5, 54px); grid-template-rows: repeat(3, 54px); gap: 5px; }
      .cmd { position: relative; width: 54px; height: 54px; padding: 0; border: none; background: url(ui/tile.png) center / 100% 100%; }
      .cmd img { position: absolute; inset: 7px; width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 1px 1px #000); }
      .cmd kbd { position: absolute; left: 3px; top: 3px; }
      .cmd:hover:not(:disabled) { background: url(ui/tile.png) center / 100% 100%; filter: brightness(1.25); box-shadow: 0 0 10px rgba(255, 179, 71, .45); }
      .cmd.active { box-shadow: 0 0 0 2px var(--amber), 0 0 12px rgba(255, 179, 71, .6); }
      .cmd:disabled { opacity: 1; }
      .cmd:disabled img { filter: grayscale(1) brightness(.45); }
      .cmd:disabled kbd { background: #6f6754; }
      .cmd .lock { position: absolute; right: 3px; bottom: 2px; font-size: 11px; color: #d8cfb8; text-shadow: 0 0 2px #000; }
      .cmd.empty { background: rgba(255, 255, 255, .025); border: 1px solid rgba(201, 162, 74, .12); pointer-events: none; }
      #selBox { position: relative; display: flex; gap: 14px; align-items: stretch; min-width: 0; }
      #selBox .crest { position: absolute; left: 50%; top: -46px; height: 50px; transform: translateX(-50%); pointer-events: none; }
      #sel { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: flex-start; overflow: hidden; }
      .portrait { flex-shrink: 0; width: 112px; height: 112px; background: url(ui/tile.png) center / 100% 100%; display: grid; place-items: center; }
      .portrait img { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 2px 2px #000); }
      .selInfo { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
      .selName { font-size: 17px; letter-spacing: 2px; text-transform: uppercase; color: var(--enamel); }
      .selName small { color: var(--amber); letter-spacing: 1px; font-size: 12px; margin-left: 6px; }
      .hpbar { width: 240px; height: 9px; background: #1b1416; border: 1px solid #3a2c22; position: relative; }
      .hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2fae5d, #7dffb0); }
      .hpbar.mid i { background: linear-gradient(90deg, #b58a1a, #facc15); }
      .hpbar.low i { background: linear-gradient(90deg, #8f1d1d, #ef4444); }
      .hptext { font-size: 11px; color: #a89c84; }
      .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; }
      .stat { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--enamel); }
      .stat img { width: 20px; height: 20px; }
      .stat em { font-style: normal; color: #8f8470; font-size: 11px; }
      .note { font-size: 12px; color: #b9ad94; }
      .note.warn { color: #ff8a6a; }
      .note.ok { color: var(--green); }
      .group { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; max-height: 150px; overflow: hidden; }
      .mini { position: relative; width: 44px; height: 44px; padding: 0; border: none; background: url(ui/tile.png) center / 100% 100%; }
      .mini img { position: absolute; inset: 4px; width: 36px; height: 36px; object-fit: contain; }
      .mini i { position: absolute; left: 5px; right: 5px; bottom: 4px; height: 3px; background: #1b1416; }
      .mini i b { display: block; height: 100%; background: #7dffb0; }
      #queue { display: flex; gap: 5px; align-items: flex-end; }
      #queue:empty { display: none; }
      .qitem { position: relative; width: 48px; height: 48px; padding: 0; border: none; background: url(ui/tile.png) center / 100% 100%; }
      .qitem img { position: absolute; inset: 5px; width: 38px; height: 38px; object-fit: contain; }
      .qitem span { position: absolute; right: 4px; top: 2px; font-size: 12px; color: var(--enamel); text-shadow: 0 0 2px #000; }
      .qitem i { position: absolute; left: 5px; right: 5px; bottom: 4px; height: 3px; background: #1b1416; }
      .qitem i b { display: block; height: 100%; width: 0; background: var(--cyan); }
      .qitem:hover { filter: brightness(1.3) hue-rotate(-20deg); }
      #minimapBox { display: grid; place-items: center; }
      #minimap { display: block; width: 360px; height: 180px; image-rendering: pixelated; cursor: inherit; }
      #tip { position: fixed; display: none; max-width: 300px; pointer-events: none; z-index: 30; font-size: 13px; color: var(--enamel); }
      #tip b { display: block; color: var(--amber); font-size: 14px; letter-spacing: 1px; }
      #tip small { display: block; color: #b9ad94; margin-top: 2px; }
      #alert { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 18px; font-size: 16px; color: #ff4d6d; border-color: #ff4d6d; display: none; letter-spacing: 1px; }
      .speed button.on { background: #ffb347; color: #0e0b16; }
      #toast { position: fixed; top: 108px; left: 50%; transform: translateX(-50%); padding: 6px 14px; color: #7dffb0; border-color: #7dffb0; display: none; }
      #chat { position: fixed; bottom: 230px; left: 50%; transform: translateX(-50%); width: 320px; font: inherit; font-size: 14px; padding: 8px 10px; background: #0e0b16; color: #f3e9d8; border: 1px solid #ffb347; border-radius: 4px; display: none; outline: none; }
      #end { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(8, 5, 13, .6); font-size: 56px; letter-spacing: 8px; color: #f3e9d8; pointer-events: none; }
      #end small { font-size: 14px; letter-spacing: 2px; color: #a8927a; }
      #pauseScreen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: rgba(8, 5, 13, .7); z-index: 10; }
      #pauseScreen span { font-size: 56px; letter-spacing: 10px; color: #ffb347; }
      #pauseScreen button { font-size: 16px; padding: 8px 24px; }
      #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(20, 12, 34, .82), rgba(7, 5, 11, .95)); z-index: 20; }
      .menuBox { width: 480px; max-width: calc(100vw - 32px); padding: 28px 32px; background: #0e0b16; border: 1px solid #6b4a2a; border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
      .menuBox h1 { margin: 0; font-size: 44px; letter-spacing: 10px; color: #f3e9d8; }
      .menuBox .tag { margin: 0 0 8px; color: #ffb347; letter-spacing: 1px; }
      .menuBox h3 { margin: 6px 0 0; font-weight: normal; letter-spacing: 3px; color: #7dffb0; text-transform: uppercase; font-size: 13px; }
      .menuBox label { color: #a8927a; font-size: 12px; }
      #lobby { display: flex; flex-direction: column; gap: 6px; }
      .slot { display: grid; grid-template-columns: 70px 1fr 1fr 90px 28px; gap: 6px; align-items: center; }
      .slot .who { color: #f3e9d8; letter-spacing: 1px; }
      .slot select { font: inherit; padding: 5px 6px; background: #141824; color: #f3e9d8; border: 1px solid #3a3420; border-radius: 2px; }
      .slot .swatch { display: flex; align-items: center; gap: 6px; }
      .slot .swatch i { width: 14px; height: 14px; border: 1px solid #000; flex-shrink: 0; }
      .slot .swatch select { flex: 1; min-width: 0; }
      .slot button { padding: 2px 0; }
      .addAi { align-self: flex-start; }
      .menuBox { width: 600px; }
      #seedInput { font: inherit; padding: 7px 9px; background: #1d1726; color: #f3e9d8; border: 1px solid #6b4a2a; border-radius: 3px; }
      .menuButtons { display: flex; gap: 8px; margin-top: 8px; }
      .menuButtons .primary { flex-grow: 1; padding: 10px; font-size: 15px; background: #ffb347; color: #0e0b16; }
      #pauseScreen small { color: #a8927a; font-size: 13px; letter-spacing: 1px; }
</style>
  </head>
  <body>
    <div id="top" class="frame thin">
      <span class="res" title="Metal"><img src="ui/icon_metal.png" alt="" /><b id="metal">0</b></span>
      <span class="res" title="Población"><img src="ui/icon_population.png" alt="" /><b id="pop">0</b></span>
      <span class="genBox"><img id="genEmblem" src="ui/gen1.png" alt="" /><span id="gen" class="genTag">GEN-1</span></span>
      <span id="modeTag" class="modeTag"></span>
      <button id="idle" class="pill" title="Siguiente obrero ocioso (I) · todos los ociosos (Mayús + I o Mayús + clic)"><img src="ui/portrait_worker.png" alt="" /><b id="idleCount">0</b></button>
      <span class="grow"></span>
      <span class="speed"><button data-speed="1" class="on">1×</button><button data-speed="1.5">1,5×</button><button data-speed="2">2×</button><button data-speed="3">3×</button></span>
      <span class="dim" id="debug"></span>
      <button id="sysBtn" class="pill" title="Menú">☰</button>
      <div id="sysMenu" class="frame">
        <button id="mute">Sonido: sí</button>
        <button id="fullscreen">Pantalla completa</button>
        <button id="replay" title="Descargar replay de la partida">Guardar replay</button>
        <button id="load" title="Cargar un replay y continuar desde ahí">Cargar replay</button>
        <input id="loadFile" type="file" accept=".json,application/json" hidden />
      </div>
    </div>
    <div id="alert" class="box"></div>
    <div id="toast" class="box"></div>
    <input id="chat" placeholder="Código de truco… (Enter para enviar, Esc para cerrar)" autocomplete="off" />
    <div id="pauseScreen"><span>PAUSA</span><button id="resume">Continuar</button><button id="toMenu">Menú principal</button><small>Esc o P para continuar</small></div>
    <div id="menu">
      <div class="menuBox">
        <h1>MECHAS</h1>
        <p class="tag">Estrategia en tiempo real · retrofuturismo de los 80</p>
        <h3>Nueva partida</h3>
        <label>Jugadores (como en AoE2: mismo equipo = aliados; «—» = contra todos)</label>
        <div id="lobby"></div>
        <button id="addAi" class="addAi">+ Añadir IA</button>
        <label for="seedInput">Semilla del mapa (vacía = aleatoria)</label>
        <input id="seedInput" inputmode="numeric" placeholder="aleatoria" />
        <div class="menuButtons"><button id="newGame" class="primary">Empezar partida</button><button id="menuLoad">Cargar replay</button></div>
      </div>
    </div>
    <div id="end"><span id="endText"></span><small>Partida terminada · recarga la página para jugar otra</small></div>
    <div id="hud">
      <div id="cmdBox" class="frame"><div id="actions"></div></div>
      <div id="selBox" class="frame"><img class="crest" src="ui/arch.png" alt="" /><div id="sel"></div><div id="queue"></div></div>
      <div id="minimapBox" class="frame"><canvas id="minimap"></canvas></div>
    </div>
    <div id="tip" class="frame thin"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
